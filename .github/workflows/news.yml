name: news-bot

on:
  schedule:
    - cron: "35 */2 * * *"   # كل ساعتين: تغير الأسعار + الإصابات
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run news bot
        env:
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          TYPEFULLY_SOCIAL_SET_ID: "346034"
          DRY_RUN: ${{ vars.NEWS_DRY_RUN || '0' }}
        run: python news.py
      - name: Save state
        if: always()
        run: |
          git config user.name "fpl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news_state.json || true
          git diff --staged --quiet || (git commit -m "news state" && git pull --rebase && git push)
