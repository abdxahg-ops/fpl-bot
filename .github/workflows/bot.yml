name: fpl-bot

on:
  schedule:
    - cron: "*/5 11-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          TYPEFULLY_SOCIAL_SET_ID: "346034"
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "fpl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
